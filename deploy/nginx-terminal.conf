# nginx リバースプロキシ（EC2）: 端子番号割付（2人目）システムを別ホスト名で公開。
# 80/443 → gunicorn(127.0.0.1:8100)。見積(8000)・検図(8001)・ハーネス(8002)とは別サーバブロック。
# 設置: /etc/nginx/conf.d/terminal.conf にコピーし {TERMINAL_DOMAIN} を書き換え、
#   sudo nginx -t && sudo systemctl reload nginx
# 例: harness.furukawa-lab.com  （DNSのAレコードをEC2のIPへ向ける）
# HTTPS は certbot(Let's Encrypt) で付与:  sudo certbot --nginx -d harness.furukawa-lab.com
server {
    listen 80;
    server_name {TERMINAL_DOMAIN};   # 例: harness.furukawa-lab.com

    # 【アクセス制御】
    #  ・評価フェーズ: アプリのID+パスワード画面ログイン(TERMINAL_PASSWORD)で保護。
    #  ・社内限定を強めるなら allow/deny を有効化し社内固定IP/CIDRのみ許可(多層防御)。
    #    併せて AWS セキュリティグループでも 80/443 を社内IP/VPNのみに制限すると堅牢。
    # allow {OFFICE_CIDR};
    # deny all;

    # 設計DXF一式のアップロードのため上限を大きめに。
    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # DXF解析・PDF描画は長いので読み取りタイムアウトを延長。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
