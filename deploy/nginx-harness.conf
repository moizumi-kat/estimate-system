# nginx リバースプロキシ（EC2）: ハーネスデータ自動生成システムを別ホスト名で公開。
# 80/443 → gunicorn(127.0.0.1:8002)。見積(8000)・検図(8001)とは別サーバブロック。
# 設置: /etc/nginx/conf.d/harness.conf にコピーし {HARNESS_DOMAIN} / 社内IP を書き換え、
#   sudo nginx -t && sudo systemctl reload nginx
# 例: harness.furukawa-lab.com
# HTTPS は certbot(Let's Encrypt) か ALB/ACM で付与。
server {
    listen 80;
    server_name {HARNESS_DOMAIN};   # 例: harness.furukawa-lab.com

    # 【アクセス制御】
    #  ・評価フェーズ: アプリのID+パスワード画面ログイン(HARNESS_PASSWORD)で保護＝下のIP制限は不要。
    #  ・本運用で社内限定を強める場合: 下の allow/deny を有効化し社内固定IP/CIDRのみ許可(多層防御)。
    #    併せて AWS セキュリティグループでも 80/443 を社内IP/VPNのみに制限すると堅牢。
    # allow {OFFICE_CIDR};          # 例: 203.0.113.0/24 (自社の固定IP帯)
    # allow {OFFICE_CIDR_2};        # 拠点が複数あれば追記
    # deny all;

    # DXF/ZIP アップロードのため上限を大きめに(大容量の配置図DXFに対応)。
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ハーネス生成(DXF解析・測長)は長いので読み取りタイムアウトを延長。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
