# nginx リバースプロキシ（EC2）: 図面検図システム（現場用）を別ホスト名で公開。
# 80/443 → gunicorn(127.0.0.1:8001)。積算(8000)とは別サーバブロック＝別アドレス。
# 設置: /etc/nginx/conf.d/kenzu.conf にコピーし {KENZU_DOMAIN} を書き換え、
#   sudo nginx -t && sudo systemctl reload nginx
# 例: 積算=estimate.example.co.jp / 検図=kenzu.example.co.jp のようにサブドメインで分ける。
# HTTPS は certbot(Let's Encrypt) か ALB/ACM で付与。
server {
    listen 80;
    server_name {KENZU_DOMAIN};

    # DXF/ZIP アップロードのため上限を app(45MB) 以上に。
    client_max_body_size 45m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 検図(特にR6)の処理に合わせて延長。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
