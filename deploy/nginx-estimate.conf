# nginx リバースプロキシ（EC2）: 80/443 → gunicorn(127.0.0.1:8000)
# 設置: /etc/nginx/conf.d/estimate.conf にコピーし {DOMAIN} を書き換え、sudo nginx -t && sudo systemctl reload nginx
# HTTPS は certbot(Let's Encrypt) か ALB/ACM で付与する。
server {
    listen 80;
    server_name {DOMAIN};

    # DXF/ZIP アップロードのため上限を app(40MB) 以上に。
    client_max_body_size 45m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 検図/抽出の長い処理に合わせて読み取りタイムアウトを延長。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
